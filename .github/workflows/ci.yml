name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - name: Install CPU PyTorch (Linux/Windows)
        if: runner.os != 'macOS'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Noelle
        run: python -m pip install -e ".[runtime,rag,server,peft,diffusion,dev]"
      - name: Lint (undefined names, unused imports)
        run: python -m pyflakes noelle tests packaging/build.py
      - name: Unit and UI tests
        # Integration tests need models in the local Hugging Face cache; they skip themselves when absent.
        run: python -m pytest tests/unit tests/e2e -q -m "not integration and not network"
