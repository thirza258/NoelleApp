name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon (Metal + MLX)
          - os: ubuntu-24.04    # CUDA wheels resolve against the user's driver at runtime
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    env:
      # secrets cannot appear in `if:` expressions; expose only whether one is configured
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build (and sign when secrets are configured)
        env:
          NOELLE_MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          NOELLE_NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
          NOELLE_WIN_CERT_PATH: ${{ secrets.WIN_CERT_PATH }}
          NOELLE_WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: python packaging/build.py --clean --sign
      - name: Smoke-test the frozen binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN=dist/Noelle.app/Contents/MacOS/Noelle; \
          elif [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/Noelle/Noelle.exe; else BIN=dist/Noelle/Noelle; fi
          "$BIN" download --help
          "$BIN" env list
      - uses: actions/upload-artifact@v4
        with:
          name: noelle-${{ matrix.os }}
          path: dist/Noelle-1.0.0-*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Noelle-1.0.0-*
