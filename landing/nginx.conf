map $http_accept $want_markdown {
    default 0;
    "~*text/markdown" 1;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # Custom 404 page
    error_page 404 /404.html;

    # Convenience routes for Privacy Policy & Terms of Service
    location = /privacy {
        return 301 /docs/privacy/;
    }
    location = /privacy.html {
        return 301 /docs/privacy/;
    }
    location = /terms {
        return 301 /docs/terms/;
    }
    location = /terms.html {
        return 301 /docs/terms/;
    }

    # Agent discovery documents
    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ^~ /.well-known/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /llms.txt {
        types { text/markdown txt; }
        default_type text/markdown;
    }

    location = /auth.md {
        default_type text/markdown;
    }

    location = /robots.txt {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Root route with content negotiation and discovery Link headers
    location = / {
        if ($want_markdown) { rewrite ^ /llms.txt last; }
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </auth.md>; rel="describedby"; type="text/markdown", </.well-known/agent-card.json>; rel="a2a-agent-card", </.well-known/ai-catalog.json>; rel="ai-catalog"' always;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /index.html =404;
    }

    # HTML: revalidate to ensure updates are served promptly
    location ~* \.html$ {
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </auth.md>; rel="describedby"; type="text/markdown", </.well-known/agent-card.json>; rel="a2a-agent-card", </.well-known/ai-catalog.json>; rel="ai-catalog"' always;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 0;
    }

    # JS and CSS: revalidate to propagate changes quickly
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 0;
    }

    # Media and icons: cache for 30 days
    location ~* \.(svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Static file serving and directory indexing
    location / {
        try_files $uri $uri/ =404;
    }
}
